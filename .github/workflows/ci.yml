name: CI and Docker Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run ShellCheck linter
        uses: ludeeus/action-shellcheck@2.0.0

      - name: Run unit test
        run: |
          chmod +x app_calculator.sh
          output=$(./app_calculator.sh 5 10)
          if [ "$output" != "Сумма: 15" ]; then
            echo "Тест провален: $output"
            exit 1
          fi
          echo "Тест успешно пройден!"

      - name: Run negative test (no arguments)
        run: |
          if ./app_calculator.sh; then
            echo "Тест провален: скрипт без аргументов должен завершаться с ошибкой"
            exit 1
          fi
          echo "Негативный тест успешно пройден!"

  docker-build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build Docker Image
        run: |
          docker build -t my-app:${{ github.sha }} .

      - name: Test Docker Container
        run: |
          docker run -d -p 8080:8080 --name test_app my-app:${{ github.sha }}
          sleep 2
          curl --fail --retry 5 --retry-connrefused --retry-delay 1 http://localhost:8080 || exit 1

      - name: Show container logs
        if: always()
        run: docker logs test_app || true

      - name: Cleanup
        if: always()
        run: docker rm -f test_app || true

  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Ansible Lint
        uses: ansible/ansible-lint@v26
        with:
          args: "ansible_iac/setup_env.yml"
